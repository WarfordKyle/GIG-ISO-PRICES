name: collect-iso-prices
on:
  schedule: [{cron: "*/10 * * * *"}]   # every 10 minutes
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python collect_prices.py
        env:
          PJM_KEY: ${{ secrets.PJM_KEY }}
          MISO_KEY: ${{ secrets.MISO_KEY }}
          ISONE_USER: ${{ secrets.ISONE_USER }}
          ISONE_PASS: ${{ secrets.ISONE_PASS }}
      - run: |
          git config user.name "gig-collector"; git config user.email "noreply@gigenergycorp.com"
          git add prices.json; git commit -m "update prices" || exit 0; git push

